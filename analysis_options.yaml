include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    avoid_dynamic_calls: true
    prefer_single_quotes: true
    sort_child_properties_last: true
    unawaited_futures: true
    unnecessary_lambdas: true

analyzer:
  # Kept in sync with Flutter's AnalysisOptionsMigration, which otherwise
  # rewrites this file during `flutter pub get` and leaves the tree dirty
  # for `pub publish --dry-run`. Covers every platform directory the
  # migration can ask for, so adding a platform later cannot silently
  # break the release workflow.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
